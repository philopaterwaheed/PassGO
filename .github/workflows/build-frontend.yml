name: build-passgo

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Web (WASM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build WASM
        run: make build-web
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: passGo-web
          path: |
            web/index.html
            web/wasm_exec.js
            web/main.wasm
            web/passGo_logo.svg
            web/appicon.png

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libdrm-dev \
            libgbm-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libx11-xcb-dev \
            libvulkan-dev \
            libwayland-egl1-mesa \
            libwayland-egl-backend-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev
      - name: Build desktop binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            go install gioui.org/cmd/gogio@v0.10.0
            gogio -target windows -appid com.philopaterwaheed.passgo -name passGo -version 1.0.0.1 -o dist/passGo.exe ./cmd/frontend
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            go install gioui.org/cmd/gogio@v0.10.0
            gogio -target macos -appid com.philopaterwaheed.passgo -name passGo -version 1.0.0.1 -o dist/passGo.app ./cmd/frontend
          else
            go build -o dist/passGo ./cmd/frontend
            cp cmd/frontend/appicon.png dist/passGo.png
            cat > dist/passGo.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=passGo
          Exec=passGo
          Icon=passGo
          Categories=Utility;
          EOF
          fi
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: passGo-desktop-${{ runner.os }}
          path: dist/

  mobile:
    name: Mobile (Android/iOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"
      - name: Install Gio build tools
        run: |
          go install gioui.org/cmd/gogio@v0.10.0
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
      - name: Build Android APK
        run: |
          mkdir -p dist
          gogio -target android -arch arm64 -appid com.philopaterwaheed.passgo -name passGo -version 1.0.0.1 -minsdk 23 -targetsdk 34 -o dist/passGo.apk ./cmd/frontend
      - name: Build iOS app
        run: |
          mkdir -p dist
          gogio -target ios -appid com.philopaterwaheed.passgo -name passGo -version 1.0.0.1 -minsdk 15 -o dist/passGo.app ./cmd/frontend
      - name: Upload mobile artifacts
        uses: actions/upload-artifact@v4
        with:
          name: passGo-mobile
          path: dist/

  release:
    name: Release artifacts
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - web
      - desktop
      - mobile
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
      - name: Package artifacts
        shell: bash
        run: |
          cd release
          for dir in passGo-*; do
            if [[ -d "$dir" ]]; then
              zip -r "${dir}.zip" "$dir"
            fi
          done
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/**/passGo*
          generate_release_notes: true
